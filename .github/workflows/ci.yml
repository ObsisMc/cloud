name: Cloud checks
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ora_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: 'host=127.0.0.1 port=5432 user=postgres password=postgres dbname=ora_test sslmode=disable'
      REQUIRE_POSTGRES: '1'
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go run ./cmd/checkformat
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - name: Run golangci-lint
        run: |
          golangci-lint migrate --skip-validation || true
          golangci-lint run
      - run: go test -race -count=1 -v -coverpkg=./internal/... -coverprofile=coverage.out ./...
      - run: go build ./cmd/server ./cmd/cloudctl ./cmd/simulator
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          # The change check diffs against the pull request base; full history keeps
          # merge-base resolution and commit-trailer waivers working.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated client matches api/openapi.json
        run: |
          npm run api:generate
          git status --porcelain -- src/api
          git diff -- src/api
          test -z "$(git status --porcelain -- src/api)"
      # The steps below mirror `npm run check`; keep both lists in sync.
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Module READMEs and tests present
        run: npm run check:modules
      - name: Changed modules updated their docs and tests
        if: github.event_name == 'pull_request'
        run: npm run check:modules -- --base origin/${{ github.base_ref }}
      - name: Exported symbols documented
        run: npm run check:docs
      - name: No dead code or dependencies
        run: npm run check:dead
      - name: No duplicated code
        run: npm run check:dup
      - run: npm run build
