name: Backend
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'frontend/**'
      - '**.md'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths-ignore:
      - 'frontend/**'
      - '**.md'
      - '.github/workflows/frontend.yml'
# A newer push to the same branch or pull request supersedes the running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ora_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: 'host=127.0.0.1 port=5432 user=postgres password=postgres dbname=ora_test sslmode=disable'
      REQUIRE_POSTGRES: '1'
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # `buf breaking` compares against the base branch, which needs history beyond the merge commit.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Caches ~/go/pkg/mod and ~/.cache/go-build keyed by go.sum.
          cache: true
      - run: go mod download
      - run: go run ./cmd/checkformat
      # proto/ is the single source of the internal control contract; internal/controlpb is generated
      # from it with pinned remote plugins. Lint, reject breaking changes to v1 against the base
      # branch, then regenerate and fail on drift, same as `task proto:lint` / `proto:breaking` / `proto:check`.
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: 1.73.0
      - run: buf lint
        working-directory: proto
      - run: |
          base="${{ github.base_ref || 'main' }}"
          if git cat-file -e "origin/$base:proto/buf.yaml" 2>/dev/null; then
            buf breaking --against "../.git#ref=origin/$base,subdir=proto"
          else
            echo "no contract on origin/$base; nothing to compare"
          fi
        working-directory: proto
      - run: buf generate
        working-directory: proto
      - run: git diff --exit-code -- internal/controlpb
      # Same pinned golangci-lint (go.mod `tool` directive) and config as `task lint` locally.
      - run: go tool golangci-lint config verify
      - run: go tool golangci-lint run
      - run: go test -race -count=1 -v -coverpkg=./internal/... -coverprofile=coverage.out ./...
      - run: go build ./cmd/server ./cmd/gateway ./cmd/cloudctl ./cmd/simulator
