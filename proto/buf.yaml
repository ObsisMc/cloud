# Cloud owns the Controller-facing internal control contract: this directory is the single source,
# Cloud generates its gRPC server from it, and consumers (desktop's ora-controller) pin a commit of
# this repository and generate their clients. `v1` accepts additive changes only; a breaking change
# is expressed as a sibling `v2` package while `v1` stays.
version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE
