version: '3'
tasks:
  default:
    cmds: [task --list]
  format:
    aliases: [fmt]
    cmds:
      - go tool gofumpt -w -extra .
      - go tool goimports -w -local github.com/wanglongan587/cloud .
  format:check:
    cmds: [go run ./cmd/checkformat]
  lint:
    cmds: [go tool golangci-lint run -c .golangci.yml]
  lint:fix:
    cmds: [go tool golangci-lint run -c .golangci.yml --fix]
  test:
    desc: All tests; real PostgreSQL is mandatory
    env:
      REQUIRE_POSTGRES: '1'
    cmds: [go test -count=1 -v -coverpkg=./internal/... -coverprofile=coverage.out ./...]
  test:integration:
    desc: Real HTTP + PostgreSQL + disk + Git acceptance tests
    env:
      REQUIRE_POSTGRES: '1'
    cmds: [go test -count=1 -v ./integration]
  test:unit:
    cmds: [go test ./internal/... ./cmd/...]
  test:race:
    desc: Full suite with race detector; Windows requires a C compiler
    env:
      REQUIRE_POSTGRES: '1'
      CGO_ENABLED: '1'
    cmds: [go test -race -count=1 -v ./...]
  check:
    cmds:
      - task: format:check
      - task: lint
      - task: proto:lint
      - task: proto:check
      - task: test
  build:
    cmds:
      - go build -o bin/ ./cmd/server ./cmd/gateway ./cmd/cloudctl ./cmd/simulator
  run:
    desc: Go API server on :8080
    cmds: [go run ./cmd/server]
  run:gateway:
    desc: Authentication gateway on :8081, proxying /api/v1 to the Go server; see docs/gateway.md
    cmds: [go run ./cmd/gateway]
  dev:
    desc: Cloud, authentication gateway, and Vite together; open http://localhost:5173
    deps: [run, run:gateway, frontend:dev]
  migrate:
    cmds: [go run ./cmd/cloudctl -command migrate]
  simulate:
    desc: Demonstrate real HTTP/PG/Git lifecycle with simulated execution components
    cmds: [go run ./cmd/simulator]
  openapi:
    cmds: [go run ./cmd/openapi]
  proto:lint:
    desc: Lint the Controller-facing internal control contract under proto/ (STANDARD rules)
    dir: proto
    cmds: [buf lint]
  proto:breaking:
    desc: Reject breaking changes to the contract against PROTO_BASE_REF (default main); v1 is additive only
    dir: proto
    vars:
      PROTO_BASE_REF: '{{.PROTO_BASE_REF | default "main"}}'
    cmds:
      # The first contract commit has no base to compare with; only an existing base module counts.
      - |
        if git -C .. cat-file -e "{{.PROTO_BASE_REF}}:proto/buf.yaml" 2>/dev/null; then
          buf breaking --against "../.git#ref={{.PROTO_BASE_REF}},subdir=proto"
        else
          echo "no contract on {{.PROTO_BASE_REF}}; nothing to compare"
        fi
  proto:generate:
    desc: Regenerate internal/controlpb from proto/ (needs buf and network for the pinned remote plugins)
    dir: proto
    cmds: [buf generate]
  proto:check:
    desc: Fail when the committed internal/controlpb drifts from proto/
    cmds:
      - task: proto:generate
      - git diff --exit-code -- internal/controlpb
  frontend:install:
    desc: Install frontend dependencies from package-lock.json
    cmds: [npm --prefix frontend ci]
  frontend:dev:
    desc: Vite on :5173, proxying /auth, /api and /healthz to the authentication gateway on :8081
    deps: [frontend:install]
    cmds: [npm --prefix frontend run dev]
  frontend:generate:
    desc: Regenerate api/openapi.json, then the frontend's typed react-query client from it
    cmds:
      - task: openapi
      - npm --prefix frontend run api:generate
  frontend:format:
    desc: Format frontend sources with prettier
    cmds: [npm --prefix frontend run format]
  frontend:test:
    desc: Frontend unit tests with coverage thresholds
    cmds: [npm --prefix frontend run test]
  frontend:check:
    desc: Same gate as CI; generated client must match the committed contract, then format/lint/types/tests/docs/dead-code/duplication/build
    cmds:
      - npm --prefix frontend run api:generate
      - git status --porcelain -- frontend/src/api
      - test -z "$(git status --porcelain -- frontend/src/api)"
      - npm --prefix frontend run check
  frontend:check:diff:
    desc: Modules changed since BASE (default origin/main) must also update their READMEs and tests
    vars:
      BASE: '{{.BASE | default "origin/main"}}'
    cmds:
      - npm --prefix frontend run check:modules -- --base {{.BASE}}
