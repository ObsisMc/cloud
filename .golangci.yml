# golangci-lint v2 configuration. The linter version is pinned by the `tool` directive in go.mod, so
# `task lint` locally and the Backend workflow in CI run the same binary and the same rules.
# Reference: https://golangci-lint.run/docs/configuration/file/
version: "2"
run:
  concurrency: 4
  tests: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unused
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    gocritic:
      disabled-checks:
        - whyNoLint
      enabled-tags:
        - diagnostic
        - style
        - performance
    gosec:
      excludes:
        - G104
      severity: medium
      confidence: medium
    govet:
      enable-all: false
      disable-all: false
    misspell:
      locale: US
    revive:
      confidence: 0.8
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-naming
        - name: error-strings
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
    staticcheck:
      checks:
        - all
  exclusions:
    generated: lax
    # These presets reproduce the default exclusions the v1 configuration relied on implicitly.
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Test files are exempt from these linters, as before the v2 migration.
      - linters:
          - errcheck
          - gocritic
          - gosec
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 3
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - github.com/wanglongan587/cloud
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
