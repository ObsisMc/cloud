<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Issue Board — Ora Cloud</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --line: #e2e4e8; --ink: #172b4d; --muted: #6b778c;
    --accent: #0052cc; --danger: #de350b;
    --urgent: #de350b; --high: #ff8b00; --medium: #ffab00; --low: #36b37e; --none: #8993a4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--muted); font-size: 12px; }
  header form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input, select, button, textarea { font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; background: var(--panel); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  button { cursor: pointer; background: var(--accent); color: white; border-color: var(--accent); font-weight: 600; }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  button.danger { background: var(--danger); border-color: var(--danger); }
  .tools { display: flex; gap: 8px; align-items: center; margin-left: auto; }
  #toast { position: fixed; bottom: 20px; right: 20px; background: #172b4d; color: #fff; padding: 10px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; font-size: 13px; max-width: 320px; z-index: 10; }
  #toast.err { background: var(--danger); }
  #toast.show { opacity: 1; }
  .main { display: flex; align-items: flex-start; }
  .board { display: flex; gap: 12px; padding: 16px 20px; overflow-x: auto; align-items: flex-start; flex: 1; min-width: 0; }
  .column, .group { flex: 0 0 210px; background: #ebecf0; border-radius: 10px; padding: 8px; min-height: 120px; box-shadow: inset 0 0 0 1px transparent; }
  .column.drop { background: #ddeaff; box-shadow: inset 0 0 0 2px var(--accent); }
  .column h2, .group h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 4px 6px 10px; display: flex; justify-content: space-between; }
  .column h2 .count, .group h2 .count { background: #d0d3d9; color: var(--ink); border-radius: 10px; padding: 1px 7px; font-size: 11px; }
  .cards { min-height: 8px; }
  .card { background: var(--panel); border-radius: 6px; padding: 8px 10px; margin: 0 0 8px; box-shadow: 0 1px 2px rgba(9,30,66,.25); cursor: pointer; position: relative; }
  .card.dragging { opacity: .5; }
  .card .num { font-size: 11px; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
  .card .title { font-size: 13px; line-height: 1.35; word-break: break-word; margin-top: 2px; }
  .card .meta { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .badge { font-size: 10px; font-weight: 700; text-transform: uppercase; border-radius: 4px; padding: 2px 6px; color: #fff; cursor: pointer; }
  .badge.urgent { background: var(--urgent); } .badge.high { background: var(--high); } .badge.medium { background: var(--medium); }
  .badge.low { background: var(--low); } .badge.none { background: var(--none); }
  .lbl { font-size: 10px; font-weight: 700; border-radius: 4px; padding: 2px 6px; color: #fff; background: #8993a4; }
  .labels { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .pos { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }
  .card .del { position: absolute; top: 4px; right: 6px; border: none; background: transparent; color: var(--muted); font-size: 14px; padding: 0 4px; display: none; line-height: 1; }
  .card:hover .del { display: block; }
  .card .del:hover { color: var(--danger); }
  .empty { color: var(--muted); font-size: 12px; text-align: center; padding: 12px 0; }
  .hint { color: var(--muted); font-size: 12px; padding: 0 20px 20px; }
  #detail { flex: 0 0 320px; background: var(--panel); border-left: 1px solid var(--line); padding: 16px; position: sticky; top: 0; max-height: calc(100vh - 20px); overflow-y: auto; }
  #detail.hidden { display: none; }
  #detail .d-head { display: flex; align-items: baseline; gap: 8px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  #detail .d-head h2 { font-size: 16px; margin: 0; flex: 1; word-break: break-word; }
  #detail .d-head .num { color: var(--muted); font-weight: 700; }
  #detail .d-meta { display: flex; align-items: center; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
  #detail .d-section { border-top: 1px solid var(--line); padding: 10px 0; }
  #detail .d-section h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 0 0 8px; }
  #detail .d-muted { color: var(--muted); font-size: 12px; }
  #detail .d-prop { font-size: 13px; font-variant-numeric: tabular-nums; margin: 2px 0; }
  #detail .d-attach { display: flex; gap: 6px; margin-top: 8px; }
  #detail .d-attach select { flex: 1; min-width: 0; }
  #detail .cmt { border-top: 1px solid var(--line); padding: 8px 0; }
  #detail .cmt:first-of-type { border-top: none; }
  #detail .cmt .who { font-size: 11px; color: var(--muted); }
  #detail .cmt .body { font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  #detail textarea { width: 100%; margin-top: 8px; resize: vertical; }
  #detail .d-actions { display: flex; gap: 8px; margin-top: 12px; }
</style>
</head>
<body>
<header>
  <h1>Issue Board</h1>
  <span class="sub" id="tenant"></span>
  <form id="add">
    <input id="title" placeholder="New issue title" required maxlength="200">
    <select id="priority">
      <option value="none">none</option>
      <option value="low">low</option>
      <option value="medium">medium</option>
      <option value="high">high</option>
      <option value="urgent">urgent</option>
    </select>
    <select id="status"></select>
    <button type="submit">Add</button>
  </form>
  <form id="newcol">
    <input id="colkey" placeholder="column key" maxlength="32" title="lowercase letters, digits, underscore">
    <input id="colname" placeholder="column name" maxlength="200">
    <button type="submit" class="ghost">+ Column</button>
  </form>
  <div class="tools">
    <input id="search" placeholder="Search title / description">
    <select id="groupBy">
      <option value="board">Board</option>
      <option value="priority">By priority</option>
      <option value="assigneeUserId">By assignee</option>
    </select>
    <button type="button" id="refresh" class="ghost">Refresh</button>
  </div>
</header>
<div class="main">
  <div class="board" id="board"></div>
  <aside id="detail" class="hidden"></aside>
</div>
<p class="hint">Drag cards between or within columns. Click a card to open comments, labels, subscribers, and properties. Click a priority badge to cycle priorities. Use the search box (?q=) and group switcher above.</p>
<div id="toast"></div>

<script type="module">
  async function loadConfig() { return fetch('/demo/config').then(r => r.json()); }
  let cfg = await loadConfig();
  const base = '/api/v1/tenants/' + cfg.tenantId;
  const priorities = cfg.priorities;                       // urgent → none
  document.getElementById('tenant').textContent = 'tenant ' + cfg.tenantId + ' · ' + cfg.user.displayName;

  const statusName = k => { const s = cfg.statuses.find(x => x.key === k); return s ? s.name : k; };
  const statusColor = k => { const s = cfg.statuses.find(x => x.key === k); return s ? s.color : ''; };

  const statusSel = document.getElementById('status');
  function fillStatusSelect() {
    statusSel.innerHTML = '';
    cfg.statuses.forEach(s => statusSel.add(new Option(s.name, s.key)));
    statusSel.value = 'todo';
  }
  fillStatusSelect();

  const state = { issues: [], groups: [], mode: 'board', search: '', selected: null, selectedSubs: [], dragId: null };

  function uuid() { return (crypto.randomUUID && crypto.randomUUID()) || 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16); }); }

  async function api(method, path, body) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (method === 'POST' || method === 'DELETE') opts.headers['Idempotency-Key'] = uuid();
    if (body !== undefined) opts.body = JSON.stringify(body);
    const res = await fetch(base + path, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.code || data.params?.field || ('HTTP ' + res.status));
    return data;
  }

  function toast(msg, err) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = err ? 'show err' : 'show';
    clearTimeout(t._x); t._x = setTimeout(() => t.className = '', 2600);
  }

  async function mutate(fn, ok) {
    try { await fn(); await load(); if (state.selected) await openDetail(state.selected.id); toast(ok); }
    catch (err) { toast(err.message, true); await load(); }
  }

  function cardsOf(status) {
    return state.issues.filter(i => i.status === status)
      .sort((a, b) => (a.position - b.position) || (a.id < b.id ? -1 : 1));
  }
  function current(id) { return state.issues.find(i => i.id === id); }

  function makeCard(it, draggable, targetStatus) {
    const card = document.createElement('div');
    card.className = 'card'; card.dataset.id = it.id; card.draggable = !!draggable;
    const num = document.createElement('span'); num.className = 'num'; num.textContent = '#' + it.number;
    const title = document.createElement('div'); title.className = 'title'; title.textContent = it.title;
    const meta = document.createElement('div'); meta.className = 'meta';
    const badge = document.createElement('span'); badge.className = 'badge ' + it.priority; badge.textContent = it.priority;
    badge.title = 'Click to cycle priority';
    const labels = document.createElement('span'); labels.className = 'labels';
    for (const l of (it.labels || [])) {
      const pill = document.createElement('span'); pill.className = 'lbl'; pill.textContent = l.name;
      if (l.color) pill.style.background = l.color;
      labels.appendChild(pill);
    }
    meta.append(badge, labels);
    const del = document.createElement('button'); del.className = 'del'; del.textContent = '×'; del.title = 'Delete';
    card.append(num, title, meta, del);
    card.addEventListener('click', () => openDetail(it.id));
    badge.addEventListener('click', e => { e.stopPropagation(); cyclePriority(it); });
    del.addEventListener('click', e => { e.stopPropagation(); remove(it); });
    if (draggable) {
      card.addEventListener('dragstart', e => { state.dragId = it.id; card.classList.add('dragging'); e.dataTransfer.setData('text/plain', it.id); e.dataTransfer.effectAllowed = 'move'; });
      card.addEventListener('dragend', () => card.classList.remove('dragging'));
      card.addEventListener('dragover', e => e.preventDefault());
      card.addEventListener('drop', e => onDrop(e, targetStatus));
    }
    return card;
  }

  function renderBoard() {
    const board = document.getElementById('board');
    board.innerHTML = '';
    for (const st of cfg.statuses) {
      const col = document.createElement('div');
      col.className = 'column'; col.dataset.status = st.key;
      if (st.color) col.style.borderTop = '3px solid ' + st.color;
      const h = document.createElement('h2');
      const dot = st.color ? '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + st.color + ';margin-right:4px"></span>' : '';
      h.innerHTML = dot + statusName(st.key) + ' <span class="count"></span>';
      const cards = document.createElement('div'); cards.className = 'cards';
      const list = cardsOf(st.key);
      h.querySelector('.count').textContent = list.length;
      if (!list.length) {
        const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Drop here';
        cards.appendChild(e);
      }
      for (const it of list) cards.appendChild(makeCard(it, true, st.key));
      col.append(h, cards);
      col.addEventListener('dragover', e => { if (e.dataTransfer.types.includes('text/plain')) { e.preventDefault(); col.classList.add('drop'); } });
      col.addEventListener('dragleave', () => col.classList.remove('drop'));
      col.addEventListener('drop', e => { col.classList.remove('drop'); onDrop(e, st.key); });
      board.appendChild(col);
    }
  }

  function groupLabel(key) {
    if (state.mode === 'priority') return key.charAt(0).toUpperCase() + key.slice(1);
    return key === 'unassigned' ? 'Unassigned' : key;
  }

  function renderGroups() {
    const board = document.getElementById('board');
    board.innerHTML = '';
    for (const g of state.groups) {
      const sec = document.createElement('div'); sec.className = 'group';
      const h = document.createElement('h2'); h.innerHTML = groupLabel(g.key) + ' <span class="count"></span>';
      const list = document.createElement('div'); list.className = 'cards';
      const items = g.items || [];
      h.querySelector('.count').textContent = items.length;
      for (const it of items) list.appendChild(makeCard(it, false));
      sec.append(h, list);
      board.appendChild(sec);
    }
    if (!state.groups.length) {
      const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'No issues';
      board.appendChild(e);
    }
  }

  async function load() {
    if (state.mode === 'board') {
      const qs = state.search ? '?q=' + encodeURIComponent(state.search) : '';
      const data = await api('GET', '/issues' + qs);
      state.issues = data.items || [];
      renderBoard();
    } else {
      const p = new URLSearchParams({ by: state.mode });
      if (state.search) p.set('q', state.search);
      const data = await api('GET', '/issue-groups?' + p.toString());
      state.groups = data.groups || [];
      renderGroups();
    }
  }

  async function onDrop(e, targetStatus) {
    e.preventDefault();
    const id = state.dragId || e.dataTransfer.getData('text/plain');
    if (!id) return;
    const it = current(id);
    if (!it) return;
    const others = cardsOf(targetStatus).filter(i => i.id !== id);
    const body = { status: targetStatus, version: it.version };
    if (others.length) {
      let index = others.length;
      const host = document.querySelector('.column[data-status="' + targetStatus + '"] .cards');
      for (let k = 0; k < others.length; k++) {
        const el = host.querySelector('.card[data-id="' + others[k].id + '"]');
        const r = el && el.getBoundingClientRect();
        if (r && e.clientY < r.top + r.height / 2) { index = k; break; }
      }
      if (index === 0) body.afterId = others[0].id;
      else if (index >= others.length) body.beforeId = others[others.length - 1].id;
      else { body.beforeId = others[index - 1].id; body.afterId = others[index].id; }
    } else if (it.status === targetStatus) {
      return;
    }
    await mutate(() => api('POST', '/issues/' + id + '/move', body), 'Moved ' + it.title);
  }

  async function cyclePriority(it) {
    const i = priorities.indexOf(it.priority);
    const next = priorities[(i + 1) % priorities.length];
    await mutate(() => api('PUT', '/issues/' + it.id, { priority: next, version: it.version }), 'Priority → ' + next);
  }

  async function rename(it) {
    const title = prompt('Edit title', it.title);
    if (title == null || title.trim() === '') return;
    await mutate(() => api('PUT', '/issues/' + it.id, { title: title.trim(), version: it.version }), 'Renamed');
  }

  async function remove(it) {
    if (!confirm('Delete "' + it.title + '"?')) return;
    await mutate(() => api('DELETE', '/issues/' + it.id, { version: it.version }), 'Deleted');
    document.getElementById('detail').classList.add('hidden');
    state.selected = null;
  }

  async function openDetail(id) {
    try {
      const [issue, comments, subs] = await Promise.all([
        api('GET', '/issues/' + id),
        api('GET', '/issues/' + id + '/comments'),
        api('GET', '/issues/' + id + '/subscribers'),
      ]);
      state.selected = issue;
      state.selectedSubs = subs.items || [];
      renderDetail(issue, comments, subs);
    } catch (err) { toast(err.message, true); }
  }

  function renderDetail(issue, comments, subs) {
    const d = document.getElementById('detail');
    d.innerHTML = '';
    d.classList.remove('hidden');

    const head = document.createElement('div'); head.className = 'd-head';
    const num = document.createElement('span'); num.className = 'num'; num.textContent = '#' + issue.number;
    const h2 = document.createElement('h2'); h2.textContent = issue.title;
    const close = document.createElement('button'); close.className = 'ghost'; close.textContent = '×';
    close.addEventListener('click', () => { d.classList.add('hidden'); state.selected = null; });
    head.append(num, h2, close);

    const meta = document.createElement('div'); meta.className = 'd-meta';
    const badge = document.createElement('span'); badge.className = 'badge ' + issue.priority; badge.textContent = issue.priority;
    const st = document.createElement('span'); st.className = 'd-muted'; st.textContent = statusName(issue.status);
    meta.append(badge, st);

    const props = document.createElement('div'); props.className = 'd-section';
    const ph = document.createElement('h3'); ph.textContent = 'Properties'; props.appendChild(ph);
    const pkeys = Object.keys(issue.properties || {});
    if (pkeys.length) for (const k of pkeys) {
      const row = document.createElement('div'); row.className = 'd-prop';
      row.textContent = k + ': ' + JSON.stringify(issue.properties[k]);
      props.appendChild(row);
    } else { const e = document.createElement('div'); e.className = 'd-muted'; e.textContent = '(none)'; props.appendChild(e); }

    const lab = document.createElement('div'); lab.className = 'd-section';
    const lh = document.createElement('h3'); lh.textContent = 'Labels'; lab.appendChild(lh);
    const labRow = document.createElement('div'); labRow.className = 'labels';
    for (const l of (issue.labels || [])) {
      const pill = document.createElement('span'); pill.className = 'lbl'; pill.textContent = l.name + ' ×';
      pill.style.cursor = 'pointer'; pill.title = 'Click to remove';
      if (l.color) pill.style.background = l.color;
      pill.addEventListener('click', () => detachLabel(issue.id, l.id));
      labRow.appendChild(pill);
    }
    lab.appendChild(labRow);
    const attachRow = document.createElement('div'); attachRow.className = 'd-attach';
    const sel = document.createElement('select'); sel.add(new Option('Attach label…', ''));
    const attached = new Set((issue.labels || []).map(l => l.id));
    for (const l of cfg.labels) if (!attached.has(l.id)) sel.add(new Option(l.name, l.id));
    const addBtn = document.createElement('button'); addBtn.className = 'ghost'; addBtn.textContent = 'Attach';
    addBtn.addEventListener('click', () => { if (sel.value) attachLabel(issue.id, sel.value); });
    attachRow.append(sel, addBtn);
    lab.appendChild(attachRow);

    const sub = document.createElement('div'); sub.className = 'd-section';
    const sh = document.createElement('h3'); sh.textContent = 'Subscribers (' + subs.items.length + ')'; sub.appendChild(sh);
    const isSub = subs.items.some(u => u.id === cfg.user.id);
    const subBtn = document.createElement('button'); subBtn.className = 'ghost'; subBtn.textContent = isSub ? 'Unsubscribe' : 'Subscribe';
    subBtn.addEventListener('click', () => toggleSubscribe(issue.id));
    sub.appendChild(subBtn);

    const cmt = document.createElement('div'); cmt.className = 'd-section';
    const ch = document.createElement('h3'); ch.textContent = 'Comments'; cmt.appendChild(ch);
    if (!comments.items.length) { const e = document.createElement('div'); e.className = 'd-muted'; e.textContent = '(no comments)'; cmt.appendChild(e); }
    for (const c of comments.items) {
      const item = document.createElement('div'); item.className = 'cmt';
      const who = document.createElement('div'); who.className = 'who'; who.textContent = c.authorUserId === cfg.user.id ? 'You' : c.authorUserId;
      const body = document.createElement('div'); body.className = 'body'; body.textContent = c.body;
      item.append(who, body); cmt.appendChild(item);
    }
    const ta = document.createElement('textarea'); ta.placeholder = 'Add a comment…'; ta.rows = 3;
    const send = document.createElement('button'); send.textContent = 'Add comment';
    send.addEventListener('click', () => { if (ta.value.trim()) addComment(issue.id, ta.value.trim()); });
    cmt.append(ta, send);

    const actions = document.createElement('div'); actions.className = 'd-actions';
    const edit = document.createElement('button'); edit.className = 'ghost'; edit.textContent = 'Edit title';
    edit.addEventListener('click', () => rename(issue));
    const del = document.createElement('button'); del.className = 'danger'; del.textContent = 'Delete';
    del.addEventListener('click', () => remove(issue));
    actions.append(edit, del);

    d.append(head, meta, props, lab, sub, cmt, actions);
  }

  async function addComment(id, body) { await mutate(() => api('POST', '/issues/' + id + '/comments', { body }), 'Comment added'); }
  async function attachLabel(id, labelId) { await mutate(() => api('POST', '/issues/' + id + '/labels', { labelId }), 'Label attached'); }
  async function detachLabel(id, labelId) { await mutate(() => api('DELETE', '/issues/' + id + '/labels/' + labelId, {}), 'Label removed'); }
  async function toggleSubscribe(id) {
    const isSub = state.selectedSubs.some(u => u.id === cfg.user.id);
    if (isSub) await mutate(() => api('DELETE', '/issues/' + id + '/subscribers', { userId: cfg.user.id }), 'Unsubscribed');
    else await mutate(() => api('POST', '/issues/' + id + '/subscribers', { userId: cfg.user.id }), 'Subscribed');
  }

  async function createColumn(key, name) {
    try {
      await api('POST', '/issue-statuses', { key: key.trim(), name: name.trim(), category: 'started' });
      cfg = await loadConfig();
      fillStatusSelect();
      await load();
      toast('Column created');
    } catch (err) { toast(err.message, true); }
  }

  document.getElementById('add').addEventListener('submit', async e => {
    e.preventDefault();
    const body = { title: document.getElementById('title').value.trim(), priority: document.getElementById('priority').value, status: document.getElementById('status').value };
    try { await api('POST', '/issues', body); document.getElementById('title').value = ''; await load(); toast('Created'); }
    catch (err) { toast(err.message, true); }
  });

  document.getElementById('newcol').addEventListener('submit', async e => {
    e.preventDefault();
    const key = document.getElementById('colkey').value.trim();
    const name = document.getElementById('colname').value.trim();
    if (!key || !name) { toast('Both key and name are required', true); return; }
    await createColumn(key, name);
    document.getElementById('colkey').value = '';
    document.getElementById('colname').value = '';
  });

  document.getElementById('search').addEventListener('input', e => { state.search = e.target.value.trim(); load().catch(err => toast(err.message, true)); });
  document.getElementById('groupBy').addEventListener('change', e => { state.mode = e.target.value; load().catch(err => toast(err.message, true)); });
  document.getElementById('refresh').addEventListener('click', async () => {
    try { cfg = await loadConfig(); fillStatusSelect(); await load(); toast('Refreshed'); }
    catch (err) { toast(err.message, true); }
  });

  load().catch(err => toast('Failed to load board: ' + err.message, true));
</script>
</body>
</html>
