<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Issue 看板 — Ora Cloud</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --line: #e2e4e8; --ink: #172b4d; --muted: #6b778c;
    --accent: #0052cc; --danger: #de350b;
    --urgent: #de350b; --high: #ff8b00; --medium: #ffab00; --low: #36b37e; --none: #8993a4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--muted); font-size: 12px; }
  header form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input, select, button, textarea { font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; background: var(--panel); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  button { cursor: pointer; background: var(--accent); color: white; border-color: var(--accent); font-weight: 600; }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  button.danger { background: var(--danger); border-color: var(--danger); }
  button.small { padding: 3px 8px; font-size: 12px; }
  .tools { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap; }
  #toast { position: fixed; bottom: 20px; right: 20px; background: #172b4d; color: #fff; padding: 10px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; font-size: 13px; max-width: 320px; z-index: 10; }
  #toast.err { background: var(--danger); }
  #toast.show { opacity: 1; }
  .main { display: flex; align-items: flex-start; }
  .board { display: flex; gap: 12px; padding: 16px 20px; overflow-x: auto; align-items: flex-start; flex: 1; min-width: 0; }
  .column, .group { flex: 0 0 220px; background: #ebecf0; border-radius: 10px; padding: 8px; min-height: 120px; box-shadow: inset 0 0 0 1px transparent; }
  .column.drop { background: #ddeaff; box-shadow: inset 0 0 0 2px var(--accent); }
  .column h2, .group h2 { font-size: 13px; letter-spacing: .5px; color: var(--muted); margin: 4px 6px 10px; display: flex; justify-content: space-between; }
  .column h2 .count, .group h2 .count { background: #d0d3d9; color: var(--ink); border-radius: 10px; padding: 1px 7px; font-size: 11px; }
  .cards { min-height: 8px; }
  .card { background: var(--panel); border-radius: 6px; padding: 8px 10px; margin: 0 0 8px; box-shadow: 0 1px 2px rgba(9,30,66,.25); cursor: pointer; position: relative; }
  .card.dragging { opacity: .5; }
  .card.selected { outline: 2px solid var(--accent); }
  .card .num { font-size: 11px; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
  .card .top { display: flex; align-items: center; gap: 6px; }
  .card.child { margin-left: 24px; box-shadow: 0 1px 2px rgba(9,30,66,.18), inset 2px 0 0 var(--accent); }
  .subbadge { font-size: 10px; color: var(--muted); background: #dfe1e6; border-radius: 4px; padding: 1px 5px; cursor: pointer; white-space: nowrap; }
  .subbadge:hover { background: #c1c7d0; color: var(--ink); }
  .parentref { font-size: 10px; color: var(--muted); margin-left: 4px; }
  .card .title { font-size: 13px; line-height: 1.35; word-break: break-word; margin-top: 2px; }
  .card .meta { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .badge { font-size: 10px; font-weight: 700; border-radius: 4px; padding: 2px 6px; color: #fff; cursor: pointer; }
  .badge.urgent { background: var(--urgent); } .badge.high { background: var(--high); } .badge.medium { background: var(--medium); }
  .badge.low { background: var(--low); } .badge.none { background: var(--none); }
  .lbl { font-size: 10px; font-weight: 700; border-radius: 4px; padding: 2px 6px; color: #fff; background: #8993a4; }
  .labels { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .assignee { font-size: 10px; color: var(--muted); background: #eef2f7; border-radius: 10px; padding: 1px 7px; margin-left: auto; }
  .card .sel { position: absolute; top: 6px; left: 6px; width: 14px; height: 14px; margin: 0; display: none; }
  .card:hover .sel, .card.selected .sel { display: block; }
  .card.selected { padding-left: 26px; }
  .card .del { position: absolute; top: 4px; right: 6px; border: none; background: transparent; color: var(--muted); font-size: 14px; padding: 0 4px; display: none; line-height: 1; }
  .card:hover .del { display: block; }
  .card .del:hover { color: var(--danger); }
  .empty { color: var(--muted); font-size: 12px; text-align: center; padding: 12px 0; }
  .hint { color: var(--muted); font-size: 12px; padding: 0 20px 20px; }
  #batchbar { display: none; align-items: center; gap: 10px; padding: 8px 20px; background: #fff7e6; border-bottom: 1px solid #ffe58f; font-size: 13px; flex-wrap: wrap; }
  #batchbar.show { display: flex; }
  #detail { flex: 0 0 340px; background: var(--panel); border-left: 1px solid var(--line); padding: 16px; position: sticky; top: 0; max-height: calc(100vh - 20px); overflow-y: auto; }
  #detail.hidden { display: none; }
  #detail .d-head { display: flex; align-items: baseline; gap: 8px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  #detail .d-head h2 { font-size: 16px; margin: 0; flex: 1; word-break: break-word; }
  #detail .d-head .num { color: var(--muted); font-weight: 700; }
  #detail .d-meta { display: flex; align-items: center; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
  #detail .d-section { border-top: 1px solid var(--line); padding: 10px 0; }
  #detail .d-section h3 { font-size: 12px; letter-spacing: .5px; color: var(--muted); margin: 0 0 8px; }
  #detail .d-muted { color: var(--muted); font-size: 12px; }
  #detail .d-prop { font-size: 13px; font-variant-numeric: tabular-nums; margin: 2px 0; }
  #detail .d-row { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
  #detail .d-row select, #detail .d-row input { flex: 1; min-width: 0; }
  #detail .cmt { border-top: 1px solid var(--line); padding: 8px 0; }
  #detail .cmt:first-of-type { border-top: none; }
  #detail .cmt .who { font-size: 11px; color: var(--muted); }
  #detail .cmt .body { font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  #detail textarea { width: 100%; margin-top: 8px; resize: vertical; }
  #detail .d-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  #detail label.f { font-size: 12px; color: var(--muted); display: block; margin: 6px 0 2px; }
</style>
</head>
<body>
<header>
  <h1>Issue 看板</h1>
  <span class="sub" id="tenant"></span>
  <form id="add">
    <input id="title" placeholder="新 Issue 标题" required maxlength="200">
    <select id="priority">
      <option value="none">无优先级</option>
      <option value="low">低</option>
      <option value="medium">中</option>
      <option value="high">高</option>
      <option value="urgent">紧急</option>
    </select>
    <select id="status"></select>
    <select id="assignee"></select>
    <button type="submit">新建</button>
  </form>
  <form id="newcol">
    <input id="colkey" placeholder="列 key" maxlength="32" title="小写字母、数字、下划线">
    <input id="colname" placeholder="列名称" maxlength="200">
    <button type="submit" class="ghost">+ 列</button>
  </form>
  <form id="newlabel">
    <input id="labelname" placeholder="新标签名" maxlength="200">
    <input id="labelcolor" type="color" value="#8993a4" title="标签颜色" style="padding:2px;width:38px;height:32px">
    <button type="submit" class="ghost">+ 标签</button>
  </form>
  <div class="tools">
    <input id="search" placeholder="搜索标题 / 描述">
    <select id="viewSel"></select>
    <button type="button" id="saveView" class="ghost small">存为视图</button>
    <select id="groupBy">
      <option value="board">看板</option>
      <option value="priority">按优先级</option>
      <option value="assigneeUserId">按负责人</option>
    </select>
    <button type="button" id="refresh" class="ghost">刷新</button>
  </div>
</header>
<div id="batchbar">
  <span id="batchCount">已选 0 项</span>
  <select id="batchStatus"><option value="">改状态…</option></select>
  <select id="batchPriority"><option value="">改优先级…</option></select>
  <select id="batchAssignee"><option value="">改负责人…</option></select>
  <button type="button" id="batchApply" class="small">应用</button>
  <button type="button" id="batchClear" class="ghost small">清除选择</button>
</div>
<div class="main">
  <div class="board" id="board"></div>
  <aside id="detail" class="hidden"></aside>
</div>
<p class="hint">拖拽卡片可在列内/列间移动；点卡片打开详情（负责人、父任务、描述、属性、标签、订阅、评论）。点卡片左上复选框可多选后批量修改。优先级徽标可点击循环切换。上方可搜索（?q=）、切换分组、保存/应用视图。</p>
<div id="toast"></div>

<script type="module">
  async function loadConfig() { return fetch('/demo/config').then(r => r.json()); }
  let cfg = await loadConfig();
  const base = '/api/v1/tenants/' + cfg.tenantId;
  const priorities = cfg.priorities;                       // urgent → none
  const PRIO_CN = { urgent: '紧急', high: '高', medium: '中', low: '低', none: '无' };
  document.getElementById('tenant').textContent = '租户 ' + cfg.tenantId + ' · ' + cfg.user.displayName;

  const statusName = k => { const s = cfg.statuses.find(x => x.key === k); return s ? s.name : k; };
  const memberName = id => { const m = (cfg.members || []).find(x => x.id === id); return m ? m.displayName : (id ? id.slice(0, 8) : ''); };

  const statusSel = document.getElementById('status');
  function fillStatusSelect() {
    statusSel.innerHTML = '';
    cfg.statuses.forEach(s => statusSel.add(new Option(s.name, s.key)));
    statusSel.value = 'todo';
  }
  fillStatusSelect();

  const assigneeSel = document.getElementById('assignee');
  function fillAssigneeSelect() {
    assigneeSel.innerHTML = '';
    assigneeSel.add(new Option('不指派', ''));
    (cfg.members || []).forEach(m => assigneeSel.add(new Option(m.displayName, m.id)));
  }
  fillAssigneeSelect();

  const state = {
    issues: [], groups: [], mode: 'board', search: '',
    view: null,            // 当前应用的保存视图 {id,name,filter}
    selected: null, selectedSubs: [], dragId: null,
    collapsed: new Set(), checked: new Set(),
  };

  function uuid() { return (crypto.randomUUID && crypto.randomUUID()) || 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16); }); }

  async function api(method, path, body) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (method === 'POST' || method === 'DELETE') opts.headers['Idempotency-Key'] = uuid();
    if (body !== undefined) opts.body = JSON.stringify(body);
    const res = await fetch(base + path, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.code || data.params?.field || ('HTTP ' + res.status));
    return data;
  }

  function toast(msg, err) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = err ? 'show err' : 'show';
    clearTimeout(t._x); t._x = setTimeout(() => t.className = '', 2600);
  }

  async function mutate(fn, ok) {
    try { await fn(); await load(); if (state.selected) await openDetail(state.selected.id); toast(ok); }
    catch (err) { toast(err.message, true); await load(); }
  }

  // ---- 视图过滤（在服务端 ?q= 之上叠加已存 filter 的客户端解释）----
  function viewFilter(it) {
    const f = state.view && state.view.filter;
    if (!f) return true;
    if (f.status && it.status !== f.status) return false;
    if (f.priority && it.priority !== f.priority) return false;
    if (f.assigneeUserId) {
      if (f.assigneeUserId === 'unassigned') { if (it.assigneeUserId) return false; }
      else if (it.assigneeUserId !== f.assigneeUserId) return false;
    }
    if (f.labelId && !(it.labels || []).some(l => l.id === f.labelId)) return false;
    return true;
  }

  function current(id) { return state.issues.find(i => i.id === id); }

  // ---- 子任务层级 ----
  const byPos = (a, b) => (a.position - b.position) || (a.id < b.id ? -1 : 1);
  function orderedIn(status) { return state.issues.filter(i => i.status === status && viewFilter(i)).sort(byPos); }
  function hierarchyOf(status) {
    const live = new Set(state.issues.map(i => i.id));
    const ord = orderedIn(status);
    const isRoot = i => !i.parentIssueId || !live.has(i.parentIssueId);
    const byParent = new Map();
    for (const i of ord) {
      const p = i.parentIssueId;
      if (p && live.has(p)) { if (!byParent.has(p)) byParent.set(p, []); byParent.get(p).push(i); }
    }
    const out = [];
    const emit = (i, depth) => {
      out.push({ it: i, depth });
      if (state.collapsed.has(i.id)) return;
      for (const c of (byParent.get(i.id) || [])) emit(c, depth + 1);
    };
    for (const i of ord) if (isRoot(i)) emit(i, 0);
    return out;
  }
  function parentRef(it) {
    if (!it.parentIssueId) return '';
    const p = current(it.parentIssueId);
    return p ? (' ↳ #' + p.number) : '';
  }

  function makeCard(it, draggable, targetStatus, depth, kids) {
    const card = document.createElement('div');
    card.className = 'card'; card.dataset.id = it.id; card.draggable = !!draggable;
    if (depth > 0) card.classList.add('child');
    if (state.checked.has(it.id)) card.classList.add('selected');
    const sel = document.createElement('input'); sel.type = 'checkbox'; sel.className = 'sel'; sel.checked = state.checked.has(it.id);
    sel.title = '选择以批量操作';
    sel.addEventListener('click', e => { e.stopPropagation(); toggleCheck(it.id, sel.checked); });
    const top = document.createElement('div'); top.className = 'top';
    const num = document.createElement('span'); num.className = 'num'; num.textContent = '#' + it.number;
    top.appendChild(num);
    if (depth > 0) { const pr = document.createElement('span'); pr.className = 'parentref'; pr.textContent = '└ 子任务' + parentRef(it); top.appendChild(pr); }
    if (kids > 0) {
      const sb = document.createElement('span'); sb.className = 'subbadge';
      const open = !state.collapsed.has(it.id);
      sb.textContent = (open ? '▾ ' : '▸ ') + kids + ' 子';
      sb.title = open ? '收起子任务' : '展开子任务';
      sb.addEventListener('click', e => { e.stopPropagation(); if (state.collapsed.has(it.id)) state.collapsed.delete(it.id); else state.collapsed.add(it.id); renderBoard(); });
      top.appendChild(sb);
    }
    const title = document.createElement('div'); title.className = 'title'; title.textContent = it.title;
    const meta = document.createElement('div'); meta.className = 'meta';
    const badge = document.createElement('span'); badge.className = 'badge ' + it.priority; badge.textContent = PRIO_CN[it.priority] || it.priority;
    badge.title = '点击切换优先级';
    const labels = document.createElement('span'); labels.className = 'labels';
    for (const l of (it.labels || [])) {
      const pill = document.createElement('span'); pill.className = 'lbl'; pill.textContent = l.name;
      if (l.color) pill.style.background = l.color;
      labels.appendChild(pill);
    }
    meta.append(badge, labels);
    if (it.assigneeUserId) { const asg = document.createElement('span'); asg.className = 'assignee'; asg.textContent = memberName(it.assigneeUserId); meta.appendChild(asg); }
    const del = document.createElement('button'); del.className = 'del'; del.textContent = '×'; del.title = '删除';
    card.append(sel, top, title, meta, del);
    card.addEventListener('click', () => openDetail(it.id));
    badge.addEventListener('click', e => { e.stopPropagation(); cyclePriority(it); });
    del.addEventListener('click', e => { e.stopPropagation(); remove(it); });
    if (draggable) {
      card.addEventListener('dragstart', e => { state.dragId = it.id; card.classList.add('dragging'); e.dataTransfer.setData('text/plain', it.id); e.dataTransfer.effectAllowed = 'move'; });
      card.addEventListener('dragend', () => card.classList.remove('dragging'));
      card.addEventListener('dragover', e => e.preventDefault());
      card.addEventListener('drop', e => onDrop(e, targetStatus));
    }
    return card;
  }

  function renderBoard() {
    const board = document.getElementById('board');
    board.innerHTML = '';
    for (const st of cfg.statuses) {
      const col = document.createElement('div');
      col.className = 'column'; col.dataset.status = st.key;
      if (st.color) col.style.borderTop = '3px solid ' + st.color;
      const h = document.createElement('h2');
      const dot = st.color ? '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + st.color + ';margin-right:4px"></span>' : '';
      h.innerHTML = dot + statusName(st.key) + ' <span class="count"></span>';
      const cards = document.createElement('div'); cards.className = 'cards';
      const entries = hierarchyOf(st.key);
      h.querySelector('.count').textContent = entries.length;
      if (!entries.length) {
        const e = document.createElement('div'); e.className = 'empty'; e.textContent = '拖到此处';
        cards.appendChild(e);
      }
      for (const en of entries) cards.appendChild(makeCard(en.it, true, st.key, en.depth, state.issues.filter(x => x.parentIssueId === en.it.id).length));
      col.append(h, cards);
      col.addEventListener('dragover', e => { if (e.dataTransfer.types.includes('text/plain')) { e.preventDefault(); col.classList.add('drop'); } });
      col.addEventListener('dragleave', () => col.classList.remove('drop'));
      col.addEventListener('drop', e => { col.classList.remove('drop'); onDrop(e, st.key); });
      board.appendChild(col);
    }
  }

  function groupLabel(key) {
    if (state.mode === 'priority') return PRIO_CN[key] || key;
    if (state.mode === 'assigneeUserId') return key === 'unassigned' ? '未指派' : memberName(key);
    return key;
  }

  function renderGroups() {
    const board = document.getElementById('board');
    board.innerHTML = '';
    for (const g of state.groups) {
      const sec = document.createElement('div'); sec.className = 'group';
      const h = document.createElement('h2'); h.innerHTML = groupLabel(g.key) + ' <span class="count"></span>';
      const list = document.createElement('div'); list.className = 'cards';
      const items = (g.items || []).filter(viewFilter);
      h.querySelector('.count').textContent = items.length;
      for (const it of items) list.appendChild(makeCard(it, false, undefined, 0, state.issues.filter(x => x.parentIssueId === it.id).length));
      sec.append(h, list);
      board.appendChild(sec);
    }
    if (!state.groups.length) {
      const e = document.createElement('div'); e.className = 'empty'; e.textContent = '暂无 Issue';
      board.appendChild(e);
    }
  }

  async function load() {
    if (state.mode === 'board') {
      const qs = state.search ? '?q=' + encodeURIComponent(state.search) : '';
      const data = await api('GET', '/issues' + qs);
      state.issues = data.items || [];
      renderBoard();
    } else {
      const p = new URLSearchParams({ by: state.mode });
      if (state.search) p.set('q', state.search);
      const data = await api('GET', '/issue-groups?' + p.toString());
      state.groups = data.groups || [];
      // 分组视图的卡片不带 labels，补一次全量以便层级/筛选
      if (!state.issues.length) { const all = await api('GET', '/issues'); state.issues = all.items || []; }
      renderGroups();
    }
    renderBatchBar();
  }

  async function onDrop(e, targetStatus) {
    e.preventDefault();
    const id = state.dragId || e.dataTransfer.getData('text/plain');
    if (!id) return;
    const it = current(id);
    if (!it) return;
    const others = orderedIn(targetStatus).filter(i => i.id !== id);
    const body = { status: targetStatus, version: it.version };
    if (others.length) {
      let index = others.length;
      const host = document.querySelector('.column[data-status="' + targetStatus + '"] .cards');
      for (let k = 0; k < others.length; k++) {
        const el = host.querySelector('.card[data-id="' + others[k].id + '"]');
        const r = el && el.getBoundingClientRect();
        if (r && e.clientY < r.top + r.height / 2) { index = k; break; }
      }
      if (index === 0) body.afterId = others[0].id;
      else if (index >= others.length) body.beforeId = others[others.length - 1].id;
      else { body.beforeId = others[index - 1].id; body.afterId = others[index].id; }
    } else if (it.status === targetStatus) {
      return;
    }
    await mutate(() => api('POST', '/issues/' + id + '/move', body), '已移动 ' + it.title);
  }

  async function cyclePriority(it) {
    const i = priorities.indexOf(it.priority);
    const next = priorities[(i + 1) % priorities.length];
    await mutate(() => api('PUT', '/issues/' + it.id, { priority: next, version: it.version }), '优先级 → ' + (PRIO_CN[next] || next));
  }

  async function rename(it) {
    const title = prompt('编辑标题', it.title);
    if (title == null || title.trim() === '') return;
    await mutate(() => api('PUT', '/issues/' + it.id, { title: title.trim(), version: it.version }), '已重命名');
  }

  async function remove(it) {
    if (!confirm('删除「' + it.title + '」？')) return;
    await mutate(() => api('DELETE', '/issues/' + it.id, { version: it.version }), '已删除');
    document.getElementById('detail').classList.add('hidden');
    state.selected = null;
  }

  async function openDetail(id) {
    try {
      const [issue, comments, subs] = await Promise.all([
        api('GET', '/issues/' + id),
        api('GET', '/issues/' + id + '/comments'),
        api('GET', '/issues/' + id + '/subscribers'),
      ]);
      state.selected = issue;
      state.selectedSubs = subs.items || [];
      renderDetail(issue, comments, subs);
    } catch (err) { toast(err.message, true); }
  }

  function field(labelText, el) {
    const w = document.createElement('div');
    const l = document.createElement('label'); l.className = 'f'; l.textContent = labelText;
    w.append(l, el); return w;
  }

  function renderDetail(issue, comments, subs) {
    const d = document.getElementById('detail');
    d.innerHTML = '';
    d.classList.remove('hidden');

    const head = document.createElement('div'); head.className = 'd-head';
    const num = document.createElement('span'); num.className = 'num'; num.textContent = '#' + issue.number;
    const h2 = document.createElement('h2'); h2.textContent = issue.title;
    const close = document.createElement('button'); close.className = 'ghost'; close.textContent = '×';
    close.addEventListener('click', () => { d.classList.add('hidden'); state.selected = null; });
    head.append(num, h2, close);

    const meta = document.createElement('div'); meta.className = 'd-meta';
    const badge = document.createElement('span'); badge.className = 'badge ' + issue.priority; badge.textContent = PRIO_CN[issue.priority] || issue.priority;
    const st = document.createElement('span'); st.className = 'd-muted'; st.textContent = statusName(issue.status);
    meta.append(badge, st);

    // 基本信息：负责人 + 描述
    const info = document.createElement('div'); info.className = 'd-section';
    const ih = document.createElement('h3'); ih.textContent = '基本信息'; info.appendChild(ih);
    const asel = document.createElement('select');
    asel.add(new Option('不指派', ''));
    (cfg.members || []).forEach(m => asel.add(new Option(m.displayName, m.id)));
    asel.value = issue.assigneeUserId || '';
    asel.addEventListener('change', () => setAssignee(issue, asel.value));
    info.appendChild(field('负责人', asel));
    const dta = document.createElement('textarea'); dta.rows = 3; dta.placeholder = '添加描述…'; dta.value = issue.description || '';
    const dsave = document.createElement('button'); dsave.className = 'ghost small'; dsave.textContent = '保存描述';
    dsave.addEventListener('click', () => setDescription(issue, dta.value));
    info.appendChild(field('描述', dta)); info.appendChild(dsave);

    // 父任务
    const par = document.createElement('div'); par.className = 'd-section';
    const parh = document.createElement('h3'); parh.textContent = '父任务'; par.appendChild(parh);
    const descendants = new Set();
    (function mark(id) { for (const c of state.issues.filter(x => x.parentIssueId === id)) { descendants.add(c.id); mark(c.id); } })(issue.id);
    const psel = document.createElement('select');
    psel.add(new Option('（无父任务）', ''));
    for (const cand of state.issues.slice().sort((a, b) => a.number - b.number)) {
      if (cand.id === issue.id || descendants.has(cand.id)) continue;
      psel.add(new Option('#' + cand.number + ' ' + cand.title, cand.id));
    }
    psel.value = issue.parentIssueId || '';
    psel.addEventListener('change', () => setParent(issue, psel.value));
    par.appendChild(psel);

    // 属性
    const props = document.createElement('div'); props.className = 'd-section';
    const ph = document.createElement('h3'); ph.textContent = '自定义属性'; props.appendChild(ph);
    const pkeys = Object.keys(issue.properties || {});
    if (pkeys.length) for (const k of pkeys) {
      const row = document.createElement('div'); row.className = 'd-prop';
      row.textContent = k + ': ' + JSON.stringify(issue.properties[k]);
      props.appendChild(row);
    } else { const e = document.createElement('div'); e.className = 'd-muted'; e.textContent = '（无）'; props.appendChild(e); }

    // 标签
    const lab = document.createElement('div'); lab.className = 'd-section';
    const lh = document.createElement('h3'); lh.textContent = '标签'; lab.appendChild(lh);
    const labRow = document.createElement('div'); labRow.className = 'labels';
    for (const l of (issue.labels || [])) {
      const pill = document.createElement('span'); pill.className = 'lbl'; pill.textContent = l.name + ' ×';
      pill.style.cursor = 'pointer'; pill.title = '点击移除';
      if (l.color) pill.style.background = l.color;
      pill.addEventListener('click', () => detachLabel(issue.id, l.id));
      labRow.appendChild(pill);
    }
    lab.appendChild(labRow);
    const attachRow = document.createElement('div'); attachRow.className = 'd-row';
    const sel = document.createElement('select'); sel.add(new Option('挂载标签…', ''));
    const attached = new Set((issue.labels || []).map(l => l.id));
    for (const l of cfg.labels) if (!attached.has(l.id)) sel.add(new Option(l.name, l.id));
    const addBtn = document.createElement('button'); addBtn.className = 'ghost small'; addBtn.textContent = '挂载';
    addBtn.addEventListener('click', () => { if (sel.value) attachLabel(issue.id, sel.value); });
    attachRow.append(sel, addBtn);
    lab.appendChild(attachRow);

    // 订阅
    const sub = document.createElement('div'); sub.className = 'd-section';
    const sh = document.createElement('h3'); sh.textContent = '订阅者（' + subs.items.length + '）'; sub.appendChild(sh);
    const isSub = subs.items.some(u => u.id === cfg.user.id);
    const subBtn = document.createElement('button'); subBtn.className = 'ghost small'; subBtn.textContent = isSub ? '取消订阅' : '订阅';
    subBtn.addEventListener('click', () => toggleSubscribe(issue.id));
    sub.appendChild(subBtn);

    // 评论
    const cmt = document.createElement('div'); cmt.className = 'd-section';
    const ch = document.createElement('h3'); ch.textContent = '评论'; cmt.appendChild(ch);
    if (!comments.items.length) { const e = document.createElement('div'); e.className = 'd-muted'; e.textContent = '（暂无评论）'; cmt.appendChild(e); }
    for (const c of comments.items) {
      const item = document.createElement('div'); item.className = 'cmt';
      const who = document.createElement('div'); who.className = 'who'; who.textContent = c.authorUserId === cfg.user.id ? '我' : memberName(c.authorUserId);
      const body = document.createElement('div'); body.className = 'body'; body.textContent = c.body;
      item.append(who, body); cmt.appendChild(item);
    }
    const ta = document.createElement('textarea'); ta.placeholder = '添加评论…'; ta.rows = 3;
    const send = document.createElement('button'); send.textContent = '发表评论';
    send.addEventListener('click', () => { if (ta.value.trim()) addComment(issue.id, ta.value.trim()); });
    cmt.append(ta, send);

    // 操作
    const actions = document.createElement('div'); actions.className = 'd-actions';
    const edit = document.createElement('button'); edit.className = 'ghost'; edit.textContent = '改标题';
    edit.addEventListener('click', () => rename(issue));
    const del = document.createElement('button'); del.className = 'danger'; del.textContent = '删除';
    del.addEventListener('click', () => remove(issue));
    actions.append(edit, del);

    d.append(head, meta, info, par, props, lab, sub, cmt, actions);
  }

  async function setParent(it, parentId) {
    await mutate(() => api('PUT', '/issues/' + it.id, { parentIssueId: parentId, version: it.version }),
      parentId ? '已设置父任务' : '已解除父任务');
  }
  async function setAssignee(it, assigneeUserId) {
    await mutate(() => api('PUT', '/issues/' + it.id, { assigneeUserId, version: it.version }),
      assigneeUserId ? '已指派' : '已取消指派');
  }
  async function setDescription(it, description) {
    await mutate(() => api('PUT', '/issues/' + it.id, { description: description.trim(), version: it.version }), '描述已保存');
  }
  async function addComment(id, body) { await mutate(() => api('POST', '/issues/' + id + '/comments', { body }), '评论已发表'); }
  async function attachLabel(id, labelId) { await mutate(() => api('POST', '/issues/' + id + '/labels', { labelId }), '标签已挂载'); }
  async function detachLabel(id, labelId) { await mutate(() => api('DELETE', '/issues/' + id + '/labels/' + labelId, {}), '标签已移除'); }
  async function toggleSubscribe(id) {
    const isSub = state.selectedSubs.some(u => u.id === cfg.user.id);
    if (isSub) await mutate(() => api('DELETE', '/issues/' + id + '/subscribers', { userId: cfg.user.id }), '已取消订阅');
    else await mutate(() => api('POST', '/issues/' + id + '/subscribers', { userId: cfg.user.id }), '已订阅');
  }

  // ---- 批量操作 ----
  function toggleCheck(id, on) { if (on) state.checked.add(id); else state.checked.delete(id); renderBoard(); renderBatchBar(); }
  function renderBatchBar() {
    const bar = document.getElementById('batchbar');
    const n = state.checked.size;
    document.getElementById('batchCount').textContent = '已选 ' + n + ' 项';
    bar.classList.toggle('show', n > 0);
  }
  function fillBatchSelects() {
    const bs = document.getElementById('batchStatus');
    bs.innerHTML = '<option value="">改状态…</option>';
    cfg.statuses.forEach(s => bs.add(new Option(s.name, s.key)));
    const bp = document.getElementById('batchPriority');
    bp.innerHTML = '<option value="">改优先级…</option>';
    priorities.forEach(p => bp.add(new Option(PRIO_CN[p] || p, p)));
    const ba = document.getElementById('batchAssignee');
    ba.innerHTML = '<option value="">改负责人…</option><option value="__clear__">（清空负责人）</option>';
    (cfg.members || []).forEach(m => ba.add(new Option(m.displayName, m.id)));
  }
  fillBatchSelects();
  document.getElementById('batchClear').addEventListener('click', () => { state.checked.clear(); renderBoard(); renderBatchBar(); });
  document.getElementById('batchApply').addEventListener('click', async () => {
    const ids = [...state.checked];
    if (!ids.length) return;
    const body = { ids };
    const s = document.getElementById('batchStatus').value;
    const p = document.getElementById('batchPriority').value;
    const a = document.getElementById('batchAssignee').value;
    if (s) body.status = s;
    if (p) body.priority = p;
    if (a === '__clear__') body.assigneeUserId = '';
    else if (a) body.assigneeUserId = a;
    if (!body.status && !body.priority && body.assigneeUserId === undefined) { toast('请选择要修改的字段', true); return; }
    await mutate(() => api('POST', '/issues/batch', body), '批量已更新 ' + ids.length + ' 项');
    state.checked.clear(); renderBatchBar();
  });

  // ---- 保存视图 ----
  async function loadViews() {
    try {
      const data = await api('GET', '/issue-views');
      const vs = document.getElementById('viewSel');
      vs.innerHTML = '';
      vs.add(new Option('全部（无视图）', ''));
      (data.items || []).forEach(v => vs.add(new Option(v.name, v.id)));
      vs.value = state.view ? state.view.id : '';
      state._views = data.items || [];
    } catch (e) { /* 忽略 */ }
  }
  document.getElementById('viewSel').addEventListener('change', e => {
    const v = (state._views || []).find(x => x.id === e.target.value);
    state.view = v || null;
    renderBoard(); if (state.mode !== 'board') renderGroups();
  });
  document.getElementById('saveView').addEventListener('click', async () => {
    const name = prompt('视图名称（按当前搜索/筛选保存）', '我的视图');
    if (!name || !name.trim()) return;
    const filter = {};
    if (state.search) filter.q = state.search;
    try {
      await api('POST', '/issue-views', { name: name.trim(), filter });
      await loadViews();
      toast('视图已保存');
    } catch (err) { toast(err.message, true); }
  });

  async function createColumn(key, name) {
    try {
      await api('POST', '/issue-statuses', { key: key.trim(), name: name.trim(), category: 'started' });
      cfg = await loadConfig(); fillStatusSelect(); fillBatchSelects();
      await load();
      toast('列已创建');
    } catch (err) { toast(err.message, true); }
  }

  async function createLabel(name, color) {
    try {
      await api('POST', '/labels', { name: name.trim(), color });
      cfg = await loadConfig();
      toast('标签已创建');
    } catch (err) { toast(err.message, true); }
  }

  document.getElementById('add').addEventListener('submit', async e => {
    e.preventDefault();
    const body = { title: document.getElementById('title').value.trim(), priority: document.getElementById('priority').value, status: document.getElementById('status').value };
    const a = assigneeSel.value; if (a) body.assigneeUserId = a;
    try { await api('POST', '/issues', body); document.getElementById('title').value = ''; await load(); toast('已创建'); }
    catch (err) { toast(err.message, true); }
  });

  document.getElementById('newcol').addEventListener('submit', async e => {
    e.preventDefault();
    const key = document.getElementById('colkey').value.trim();
    const name = document.getElementById('colname').value.trim();
    if (!key || !name) { toast('列 key 和名称都必填', true); return; }
    await createColumn(key, name);
    document.getElementById('colkey').value = '';
    document.getElementById('colname').value = '';
  });

  document.getElementById('newlabel').addEventListener('submit', async e => {
    e.preventDefault();
    const name = document.getElementById('labelname').value.trim();
    const color = document.getElementById('labelcolor').value;
    if (!name) { toast('标签名必填', true); return; }
    await createLabel(name, color);
    document.getElementById('labelname').value = '';
  });

  document.getElementById('search').addEventListener('input', e => { state.search = e.target.value.trim(); load().catch(err => toast(err.message, true)); });
  document.getElementById('groupBy').addEventListener('change', e => { state.mode = e.target.value; load().catch(err => toast(err.message, true)); });
  document.getElementById('refresh').addEventListener('click', async () => {
    try { cfg = await loadConfig(); fillStatusSelect(); fillAssigneeSelect(); fillBatchSelects(); await load(); await loadViews(); toast('已刷新'); }
    catch (err) { toast(err.message, true); }
  });

  loadViews();
  load().catch(err => toast('加载看板失败：' + err.message, true));
</script>
</body>
</html>
